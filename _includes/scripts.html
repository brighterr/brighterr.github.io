<script>
  document.addEventListener("DOMContentLoaded", function () {
    var navButton = document.querySelector("#site-nav button");
    var hiddenLinks = document.querySelector("#site-nav .hidden-links");

    if (!navButton || !hiddenLinks) return;

    navButton.addEventListener("click", function () {
      var isOpen = !hiddenLinks.classList.contains("hidden");
      navButton.setAttribute("aria-expanded", String(isOpen));
      navButton.setAttribute("aria-label", isOpen ? "Close navigation" : "Open navigation");
    });

    document.querySelectorAll("#site-nav a").forEach(function (link) {
      link.addEventListener("click", function () {
        hiddenLinks.classList.add("hidden");
        navButton.classList.remove("close");
        navButton.setAttribute("aria-expanded", "false");
        navButton.setAttribute("aria-label", "Open navigation");

        if (link.hash && link.pathname === window.location.pathname) {
          window.history.replaceState(null, "", link.hash);
        }
      });
    });
  });
</script>
